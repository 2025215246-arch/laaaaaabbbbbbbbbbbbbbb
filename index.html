<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural 3D Tree</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: Arial, sans-serif; background: #cfe8f5; }
    #info {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,.88); color: #203329;
      padding: 10px 16px; border-radius: 12px; text-align: center;
      box-shadow: 0 3px 12px #0002; width: max-content; max-width: 90%;
    }
    #info strong { font-size: 18px; }
    #info div { margin-top: 5px; font-size: 13px; }
    #error { display: none; position: absolute; bottom: 12px; left: 12px; right: 12px; color: #8b1c1c; }
  </style>
</head>
<body>
  <div id="info">
    <strong>🌳 3D Tree Model</strong>
    <div>Drag to rotate · Scroll/pinch to zoom</div>
  </div>
  <div id="error">Could not load Three.js. Check your internet connection.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe8f5);
    scene.fog = new THREE.Fog(0xcfe8f5, 18, 40);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8, 7, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 3.3, 0);
    controls.minDistance = 4;
    controls.maxDistance = 24;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x62734b, 2.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(7, 12, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(15, 80),
      new THREE.MeshStandardMaterial({ color: 0x78a85d, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.04;
    ground.receiveShadow = true;
    scene.add(ground);

    // Small grassy patches around the tree
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f8b45, roughness: 1 });
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 1.7 + Math.random() * 5;
      const blade = new THREE.Mesh(
        new THREE.ConeGeometry(0.035, 0.18 + Math.random() * 0.16, 4),
        grassMat
      );
      blade.position.set(Math.cos(a) * r, 0.07, Math.sin(a) * r);
      blade.rotation.z = (Math.random() - 0.5) * 0.4;
      blade.castShadow = true;
      scene.add(blade);
    }

    const tree = new THREE.Group();
    scene.add(tree);

    const bark = new THREE.MeshStandardMaterial({ color: 0x754525, roughness: 1 });
    const barkLight = new THREE.MeshStandardMaterial({ color: 0x93603a, roughness: 1 });

    function makeBranch(start, end, radiusStart, radiusEnd, material = bark) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = new THREE.Vector3().subVectors(b, a);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusEnd, radiusStart, direction.length(), 8),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      tree.add(mesh);
    }

    // Tapered trunk
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.48, 4.2, 12),
      bark
    );
    trunk.position.y = 2.1;
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    tree.add(trunk);

    // Visible bark ridges
    for (let i = 0; i < 7; i++) {
      const angle = i * Math.PI * 2 / 7;
      makeBranch(
        [Math.cos(angle) * 0.28, 0.15, Math.sin(angle) * 0.28],
        [Math.cos(angle + 0.12) * 0.16, 3.6 + (i % 3) * 0.15, Math.sin(angle + 0.12) * 0.16],
        0.035, 0.012, barkLight
      );
    }

    // Branches spreading out from the trunk
    const branchData = [
      [[0,2.4,0],[-1.25,3.45,0.15]],
      [[0,2.8,0],[1.25,3.75,0.1]],
      [[0,3.1,0],[0.15,4.15,1.05]],
      [[0,3.25,0],[-0.2,4.05,-1.1]],
      [[0,3.55,0],[-0.9,4.5,0.7]],
      [[0,3.7,0],[0.95,4.65,-0.55]],
      [[0,3.9,0],[0.1,5.0,0.2]]
    ];
    for (const [a,b] of branchData) makeBranch(a,b,0.13,0.055,bark);

    // Leaf canopy: overlapping clusters make a rounded, leafy tree crown
    const leafColors = [0x2f7d32, 0x398b35, 0x4b9b3d, 0x286b2c, 0x5ba647];
    const leafMaterials = leafColors.map(color =>
      new THREE.MeshStandardMaterial({ color, roughness: 0.92 })
    );

    function leafCluster(x, y, z, scale) {
      const material = leafMaterials[Math.floor(Math.random() * leafMaterials.length)];
      const leaf = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1, 2),
        material
      );
      leaf.position.set(x, y, z);
      leaf.scale.set(scale * (0.85 + Math.random() * 0.3),
                     scale * (0.8 + Math.random() * 0.35),
                     scale * (0.85 + Math.random() * 0.3));
      leaf.rotation.set(Math.random() * 0.6, Math.random() * Math.PI, Math.random() * 0.6);
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      tree.add(leaf);
    }

    // Main canopy shape
    const canopy = [
      [0,5.0,0,1.45],
      [-0.95,4.65,0.05,1.15],
      [0.95,4.85,0.05,1.2],
      [0,4.75,0.95,1.15],
      [0,4.8,-0.95,1.12],
      [-0.65,5.35,0.65,1.0],
      [0.7,5.45,-0.55,1.05],
      [-0.75,5.5,-0.6,1.0],
      [0.7,5.2,0.75,1.0],
      [0,6.0,0,1.0],
      [-0.35,6.2,0.25,0.8],
      [0.45,5.95,-0.2,0.85]
    ];
    for (const [x,y,z,s] of canopy) {
      leafCluster(x,y,z,s);
      // Extra smaller clusters soften gaps in the canopy
      for (let j = 0; j < 3; j++) {
        leafCluster(
          x + (Math.random() - 0.5) * s * 1.1,
          y + (Math.random() - 0.5) * s * 0.9,
          z + (Math.random() - 0.5) * s * 1.1,
          s * (0.35 + Math.random() * 0.3)
        );
      }
    }

    // A few roots at the base
    for (let i = 0; i < 6; i++) {
      const angle = i * Math.PI / 3;
      makeBranch(
        [0, 0.35, 0],
        [Math.cos(angle) * 0.85, 0.06, Math.sin(angle) * 0.85],
        0.16, 0.035, bark
      );
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
